<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="1240" height="770" font-family="Helvetica, Arial, sans-serif">
  
  <rect width="1240" height="770" fill="#fff"/>
  <text x="24" y="32" font-size="20" font-weight="700" fill="#1c2430">Engram data flow at one injected layer</text>
  <text x="24" y="53" font-size="13" fill="#59626f">Token IDs → N-gram hash → memory lookup → gating → hidden states. Tensor shapes are from our trace of the official demo.</text>

  <!-- phase 1 -->
  <rect x="14" y="72" width="1212" height="186" fill="#fafbfc" stroke="#d8dce2" rx="10"/>
  <text font-size="13" font-weight="700" fill="#1c2430" x="28" y="94">PHASE 1  RETRIEVAL — depends only on token IDs, so addresses are known before the forward pass</text>
  <rect fill="#e9f1fb" stroke="#2f6db3" stroke-width="1.4" rx="7" x="30" y="112" width="140" height="84"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="100" y="141">Token IDs</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="100" y="162">x₁ … x_T</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="100" y="180">[B, L]</text>
  <rect fill="#e9f1fb" stroke="#2f6db3" stroke-width="1.4" rx="7" x="210" y="112" width="170" height="84"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="295" y="137">Tokenizer</text><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="295" y="155">compression</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="295" y="175">x′ = P(x), V → V′</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="295" y="190">129,280 → 99,092 (V4.1)</text>
  <rect fill="#e9f1fb" stroke="#2f6db3" stroke-width="1.4" rx="7" x="420" y="112" width="160" height="84"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="500" y="141">Suffix N-grams</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="500" y="162">g_t,n = (x′_t−n+1 … x′_t)</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="500" y="180">n = 2…N</text>
  <rect fill="#e9f1fb" stroke="#2f6db3" stroke-width="1.4" rx="7" x="620" y="112" width="180" height="84"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="710" y="137">Multi-head hash</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="710" y="157">mix = ⊕ₖ (x′_t−k · mₖ)</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="710" y="174">z = mix mod primeₙ,ₕ</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="710" y="190">[B, L, (N−1)·K]</text>
  <rect fill="#fdf1dd" stroke="#b5791a" stroke-width="1.6" rx="7" x="840" y="112" width="190" height="84"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="935" y="137">Sparse memory tables</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="935" y="157">fetch (N−1)·K rows per token</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="935" y="174">table size scales,</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="935" y="190">rows fetched do not</text>
  <rect fill="#ffffff" stroke="#3d4654" stroke-width="1.4" rx="7" x="1070" y="112" width="140" height="84"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="1140" y="141">Concat eₜ</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="1140" y="162">‖ₙ ‖ₕ e_t,n,h</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="1140" y="180">[B, L, d_mem]</text>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M170 154H208"/><polygon points="208.0,154.0 199.0,149.5 199.0,158.5" fill="#3d4654"/><path fill="none" stroke="#3d4654" stroke-width="1.5" d="M380 154H418"/><polygon points="418.0,154.0 409.0,149.5 409.0,158.5" fill="#3d4654"/><path fill="none" stroke="#3d4654" stroke-width="1.5" d="M580 154H618"/><polygon points="618.0,154.0 609.0,149.5 609.0,158.5" fill="#3d4654"/><path fill="none" stroke="#3d4654" stroke-width="1.5" d="M800 154H838"/><polygon points="838.0,154.0 829.0,149.5 829.0,158.5" fill="#3d4654"/><path fill="none" stroke="#3d4654" stroke-width="1.5" d="M1030 154H1068"/><polygon points="1068.0,154.0 1059.0,149.5 1059.0,158.5" fill="#3d4654"/>
  <text font-size="12" fill="#59626f" x="840" y="222">Training: rows sharded across GPUs (All-to-All).</text>
  <text font-size="12" fill="#59626f" x="840" y="240">Inference: host DRAM, prefetched over PCIe / RDMA.</text>
  <path d="M30 214H800" stroke="#2f6db3" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <text font-size="12" fill="#2f6db3" x="30" y="234">Deterministic path: no hidden state is needed, unlike MoE routing.</text>

  <!-- phase 2 -->
  <rect x="14" y="272" width="1212" height="312" fill="#fafbfc" stroke="#d8dce2" rx="10"/>
  <text font-size="13" font-weight="700" fill="#1c2430" x="28" y="294">PHASE 2  FUSION — per branch m = 1…M (mHC), the current hidden state decides how much memory to admit</text>
  <path d="M1140 196V312H470" fill="none" stroke="#3d4654" stroke-width="1.5"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M640 312V338"/><polygon points="640.0,338.0 635.5,329.0 644.5,329.0" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M470 312V338"/><polygon points="470.0,338.0 465.5,329.0 474.5,329.0" fill="#3d4654"/>
  <rect fill="#ffffff" stroke="#3d4654" stroke-width="1.4" rx="7" x="395" y="340" width="150" height="62"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="470" y="365">Wₖ⁽ᵐ⁾ eₜ</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="470" y="386">key, one per branch</text>
  <rect fill="#ffffff" stroke="#3d4654" stroke-width="1.4" rx="7" x="565" y="340" width="150" height="62"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="640" y="365">Wᵥ eₜ</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="640" y="386">value, shared</text>
  <rect fill="#e8f5ec" stroke="#2f8a55" stroke-width="1.4" rx="7" x="30" y="432" width="170" height="82"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="115" y="462">Hidden state</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="115" y="483">H⁽ˡ⁾, query hₜ⁽ᵐ⁾</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="115" y="501">[B, L, M, d]</text>
  <rect fill="#fbe8ea" stroke="#b53a4b" stroke-width="1.6" rx="7" x="285" y="432" width="290" height="82"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="430" y="457">Context-aware gate αₜ⁽ᵐ⁾</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="430" y="477">σ( RMSNorm(h)ᵀ RMSNorm(k) / √d )</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="430" y="497">code also applies signed sqrt before σ</text>
  <rect fill="#fbe8ea" stroke="#b53a4b" stroke-width="1.6" rx="7" x="610" y="432" width="140" height="82"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="680" y="462">Gated value</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="680" y="483">α · Wᵥ eₜ</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="680" y="501">[B, L, M, d]</text>
  <rect fill="#f1f2f4" stroke="#7a828e" stroke-width="1.3" stroke-dasharray="5 4" rx="7" x="785" y="432" width="190" height="82"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="880" y="455">ShortConv + residual</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="880" y="475">SiLU(Conv1D(RMSNorm(Ṽ))) + Ṽ</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="880" y="495">omitted in DeepSeek-V4.1</text>
  <rect fill="#e8f5ec" stroke="#2f8a55" stroke-width="1.4" rx="7" x="1010" y="432" width="200" height="82"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="1110" y="462">Residual merge</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="1110" y="483">H⁽ˡ⁾ ← H⁽ˡ⁾ + Y</text><text font-size="12" fill="#3d4654" text-anchor="middle" x="1110" y="501">shape unchanged</text>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M470 402V430"/><polygon points="470.0,430.0 465.5,421.0 474.5,421.0" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M640 402V416H680V430"/><polygon points="680.0,430.0 675.5,421.0 684.5,421.0" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M200 473H283"/><polygon points="283.0,473.0 274.0,468.5 274.0,477.5" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M575 473H608"/><polygon points="608.0,473.0 599.0,468.5 599.0,477.5" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M750 473H783"/><polygon points="783.0,473.0 774.0,468.5 774.0,477.5" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M975 473H1008"/><polygon points="1008.0,473.0 999.0,468.5 999.0,477.5" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M115 514V552H1110V516"/><polygon points="1110.0,516.0 1114.5,525.0 1105.5,525.0" fill="#3d4654"/>
  <text font-size="12" fill="#59626f" x="560" y="572">residual path: H⁽ˡ⁾ passes through regardless of the gate</text>

  <!-- backbone -->
  <rect x="14" y="598" width="1212" height="96" fill="#fafbfc" stroke="#d8dce2" rx="10"/>
  <text font-size="13" font-weight="700" fill="#1c2430" x="28" y="620">BACKBONE continues as usual</text>
  <rect fill="#ffffff" stroke="#3d4654" stroke-width="1.4" rx="7" x="640" y="630" width="140" height="50"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="710" y="660">Attention</text>
  <rect fill="#ffffff" stroke="#3d4654" stroke-width="1.4" rx="7" x="820" y="630" width="140" height="50"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="890" y="660">MoE</text>
  <rect fill="#ffffff" stroke="#3d4654" stroke-width="1.4" rx="7" x="1000" y="630" width="210" height="50"/><text font-size="14.5" font-weight="700" fill="#1c2430" text-anchor="middle" x="1105" y="660">Next layer, LM head</text>
  <path d="M1190 514V588H710" fill="none" stroke="#3d4654" stroke-width="1.5"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M710 588V628"/><polygon points="710.0,628.0 705.5,619.0 714.5,619.0" fill="#3d4654"/>
  <path fill="none" stroke="#3d4654" stroke-width="1.5" d="M780 655H818"/><polygon points="818.0,655.0 809.0,650.5 809.0,659.5" fill="#3d4654"/><path fill="none" stroke="#3d4654" stroke-width="1.5" d="M960 655H998"/><polygon points="998.0,655.0 989.0,650.5 989.0,659.5" fill="#3d4654"/>

  <!-- legend -->
  <g transform="translate(24,712)">
    <rect fill="#e9f1fb" stroke="#2f6db3" stroke-width="1.4" rx="7" width="18" height="14"/><text font-size="12" fill="#59626f" x="24" y="12">Deterministic, ID-based</text>
    <rect fill="#fdf1dd" stroke="#b5791a" stroke-width="1.6" rx="7" x="190" width="18" height="14"/><text font-size="12" fill="#59626f" x="214" y="12">Large sparse storage</text>
    <rect fill="#fbe8ea" stroke="#b53a4b" stroke-width="1.6" rx="7" x="370" width="18" height="14"/><text font-size="12" fill="#59626f" x="394" y="12">Context-dependent</text>
    <rect fill="#e8f5ec" stroke="#2f8a55" stroke-width="1.4" rx="7" x="530" width="18" height="14"/><text font-size="12" fill="#59626f" x="554" y="12">Backbone state</text>
    <rect fill="#f1f2f4" stroke="#7a828e" stroke-width="1.3" stroke-dasharray="5 4" rx="7" x="670" width="18" height="14"/><text font-size="12" fill="#59626f" x="694" y="12">Optional / model dependent</text>
  </g>
  <text font-size="12" fill="#59626f" x="24" y="752">Demo: N=3, K=8, 16 rows × 64 = 1024-dim eₜ.   DeepSeek-V4.1-Flash: N=4, K=8, 24 rows × 256 = 6144-dim eₜ, modules at layers 1 and 14 (zero-indexed).</text>
</svg>
