<h2 style="font-size:64px;font-weight:700;line-height:1.15">想法：給模型一本「片語速查表」</h2>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:32px;flex:1">
<div style="background:#FFFFFF;border:1px solid #DDE1E7;border-radius:16px;padding:48px;display:flex;flex-direction:column;gap:24px">
<p style="font-size:30px;font-weight:700;color:#3D4654">MoE：多請專家</p>
<h3 style="font-size:44px;font-weight:700;line-height:1.3">每題只叫其中幾位來「算」</h3>
<p style="font-size:30px;line-height:1.5;color:#3D4654">要先理解內容，才知道該找哪位專家。擅長需要依情境思考的事。</p>
</div>
<div style="background:#FFFFFF;border:2px solid #B8501F;border-radius:16px;padding:48px;display:flex;flex-direction:column;gap:24px">
<p style="font-size:30px;font-weight:700;color:#B8501F">Engram：多一本速查表</p>
<h3 style="font-size:44px;font-weight:700;line-height:1.3">每題只「翻」其中幾頁</h3>
<p style="font-size:30px;line-height:1.5;color:#3D4654">看最後 2～4 個詞就知道翻哪頁。翻到後，由模型判斷這頁適不適用。</p>
</div>
</div>
<p style="font-size:32px;line-height:1.5;color:#3D4654">兩者互補：大部分預算給專家，一小部分給速查表，效果比全部給專家好。</p>
<aside>用考試比喻：原本的模型每題都從頭推導，加了 Engram 就像桌上多了一本公式速查表。速查表裡存的不是文字，而是代表片語意思的向量。</aside>
