<aside>不可能給每個片語一頁，所以用 hash 對應到有限的頁數。本研究的實驗 A 也發現：常見片語幾乎總能在某幾頁佔優勢，罕見片語通常每頁都被蓋過。下一頁的流程圖把這四頁的概念串在一起。</aside>
